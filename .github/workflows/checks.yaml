name: FireScope checks
on: [push, pull_request]

jobs:
  python-postgis:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: firescope
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: firescope_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U firescope -d firescope_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://firescope:ci_only@localhost:5432/firescope_test
      TEST_DATABASE_URL: postgresql+psycopg://firescope:ci_only@localhost:5432/firescope_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e ./backend -e ./data-pipeline
      # Gate undefined names now; expand as the existing lint backlog is resolved.
      - run: ruff check backend/app data-pipeline/firescope_pipeline tests --select F821,F822,F823
      - run: pytest -q
      - run: alembic -c backend/alembic.ini upgrade head --sql > /tmp/firescope-migration.sql
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_MAP_STYLE_URL: ""
      - run: python scripts/check_release.py --write-metadata
      - name: Combined production artifact smoke check
        run: |
          alembic -c backend/alembic.ini upgrade head
          APP_ENV=production uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/pirx-smoke.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/live > /dev/null; then break; fi
            sleep 1
          done
          python scripts/smoke_release.py http://127.0.0.1:8000 --expect-commit "$GITHUB_SHA" --skip-basemap
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
