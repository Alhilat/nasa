[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "firescope-api"
version = "0.1.0"
description = "Provenance-aware satellite fire observation API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.38,<2.1",
  "geoalchemy2>=0.17,<1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "shapely>=2.0.7,<3",
  "google-genai==3.3.0",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.intelligence" = ["regions.geojson"]
