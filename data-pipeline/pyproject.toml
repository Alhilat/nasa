[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "firescope-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["firescope-api==0.1.0", "pandas>=2.2,<3", "numpy>=2.1,<3", "geopandas>=1.0,<2", "httpx>=0.28,<1", "python-dotenv>=1.2,<2"]

[project.scripts]
firescope-pipeline = "firescope_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["firescope_pipeline*"]
