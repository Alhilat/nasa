name: firescope

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-firescope}
      POSTGRES_USER: ${POSTGRES_USER:-firescope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ..
      dockerfile: infrastructure/backend.Dockerfile
    image: firescope-backend:local
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-firescope}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-firescope}
      APP_ENV: development
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://localhost:8080","http://127.0.0.1:5173","http://127.0.0.1:8080"]}
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: infrastructure/backend.Dockerfile
    image: firescope-backend:local
    environment: *backend-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: infrastructure/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

  pipeline:
    image: firescope-backend:local
    build:
      context: ..
      dockerfile: infrastructure/backend.Dockerfile
    profiles: ["tools"]
    environment:
      <<: *backend-env
      MAP_KEY: ${MAP_KEY:-}
    volumes:
      - ../data:/data:ro
      - ../reports:/reports
    entrypoint: ["python", "-m", "firescope_pipeline.cli"]
    command: ["--help"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  tests:
    image: firescope-backend:local
    build:
      context: ..
      dockerfile: infrastructure/backend.Dockerfile
    profiles: ["test"]
    environment:
      <<: *backend-env
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-firescope}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-firescope}
    command: ["pytest", "-q"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgis_data:
