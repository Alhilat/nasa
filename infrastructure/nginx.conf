server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Fixed public tile services. Resolve at request time so an offline provider
    # does not prevent the UI from starting.
    resolver 127.0.0.11 valid=300s;
    location ~ ^/basemap/(imagery|reference)/([0-9]+)/([0-9]+)/([0-9]+)$ {
        limit_except GET { deny all; }
        set $arcgis_host services.arcgisonline.com;
        set $arcgis_service World_Imagery;
        if ($1 = reference) { set $arcgis_service Reference/World_Boundaries_and_Places; }
        proxy_pass https://$arcgis_host/ArcGIS/rest/services/$arcgis_service/MapServer/tile/$2/$3/$4;
        proxy_ssl_server_name on;
        proxy_ssl_name services.arcgisonline.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host services.arcgisonline.com;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 20s;
    }
    location /basemap/ { return 404; }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
