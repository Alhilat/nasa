services:
  - type: web
    name: firescope-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./infrastructure/backend.Dockerfile
    dockerContext: .
    dockerCommand: sh -c "alembic -c backend/alembic.ini upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: '["https://firescope-web.onrender.com"]'
      - key: MAP_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.1-flash-lite,gemini-3.5-flash,gemini-4-hydrogen
      - key: AI_REQUESTS_PER_MINUTE
        value: "8"
      - key: AI_REQUESTS_PER_DAY
        value: "100"
      - key: AI_CONCURRENT_REQUESTS
        value: "2"

  - type: web
    name: firescope-web
    runtime: static
    region: oregon
    rootDir: frontend
    buildCommand: npm install --global pnpm@11.25.0 && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: VITE_API_BASE_URL
        value: https://firescope-api.onrender.com/api/v1
      - key: VITE_MAP_STYLE_URL
        value: ""
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
